<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WeatherBro | Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo">
      <img src="./assets/images/weather-icon.png" alt="logo" />
      <h1>WeatherBro</h1>
    </div>
    <button id="unitToggle" class="unit-btn">°C / °F</button>
  </header>

  <main class="container">
    <h2 class="tagline">How’s the sky looking today?</h2>

    <!-- Search Bar -->
    <div class="search-bar">
      <input id="searchInput" type="text" placeholder="Search for a place..." />
      <button id="searchButton" class="search-btn">Search</button>
    </div>

    <section class="weather-info">
      <!-- Current Weather Card -->
      <div class="current-weather">
        <div class="location">
          <h3 id="cityName">Berlin, Germany</h3>
          <p id="date">Tuesday, Aug 5, 2025</p>
        </div>

        <div class="temp-icon">
          <img id="weatherIcon" src="./assets/images/sun.png" alt="Weather icon" />
          <h1 id="temperature">68°</h1>
        </div>
      </div>

      <!-- Weather Details -->
      <div class="details">
        <div class="detail-box">
          <p>Feels Like</p>
          <h4 id="feelsLike">64°</h4>
        </div>
        <div class="detail-box">
          <p>Humidity</p>
          <h4 id="humidity">46%</h4>
        </div>
        <div class="detail-box">
          <p>Wind</p>
          <h4 id="wind">9 mph</h4>
        </div>
        <div class="detail-box">
          <p>Precipitation</p>
          <h4 id="precipitation">0 in</h4>
        </div>
      </div>

      <!-- Daily Forecast -->
      <section class="daily">
        <h3>Daily forecast</h3>
        <div id="dailyList" class="forecast-grid">
          <!-- JS will inject 5-day forecast here -->
        </div>
      </section>

      <!-- Hourly Forecast -->
      <section class="hourly">
        <h3>Hourly forecast</h3>
        <div id="hourlyList" class="forecast-grid">
          <!-- JS will inject hourly forecast here -->
        </div>
      </section>
    </section>
  </main>

  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name</a>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
